  </head>

              <span id="skillPoints" class="nav-link" style="margin-right: 20px;"></span>
            </li>
            <li class="nav-item">
              <a id="profileButton" href="/profile.html" class="nav-link">Profile</a>
            </li>
            <li class="nav-item">

            </li>

                  id="registerButton"

                >

        </div>

    <main class="py-4">
        <div class="container">
          <div class="row">
            <div class="col-12">
              <h1 class="text-center">Challenge Info</h1>
            </div>
          </div>
        </div>
        <div class="container">
          <!-- Row for challenge info -->
          <div id="challengeInfo" class="row text-center my-4">
            <!-- Challenge details will be populated here by showChallengeInfo.js -->
          </div>
      
          <!-- Form for completing the challenge -->
          <div class="row justify-content-center">
            <div class="col-md-6">
              <form id="completeChallengeForm" class="card shadow p-3">
                <div class="card-body">
                  <h5 class="card-title">Complete Challenge</h5>
                  <div class="mb-3">
                    <label for="completed" class="form-label">Completed?</label>
                    <select class="form-select" id="completed" name="completed">
                      <option value="true">True</option>
                      <option value="false">False</option>
                    </select>
                  </div>
                  <div class="mb-3">
                    <label for="notes" class="form-label">Notes</label>
                    <textarea class="form-control" id="notes" name="notes" rows="3" placeholder="Enter any notes about the challenge"></textarea>
                  </div>
                  <button type="submit" class="btn btn-primary">Submit</button>
                </div>
              </form>
            </div>
          </div>
      
          <!-- Edit Challenge Section -->
          <div class="row mt-5">
            <div class="col-12">
              <h2 class="text-center">Edit Challenge</h2>
              <div id="editChallengeFormContainer" class="row justify-content-center">
                <!-- Edit Challenge form will be populated here -->
              </div>
            </div>
          </div>
      
          <!-- Challenge Records Section -->
          <div class="row mt-5">
            <div class="col-12">
              <h2 class="text-center">Challenge Records</h2>
              <div id="challengeRecords" class="row text-center my-4">
                <!-- Completed challenge records will be populated here -->
              </div>
            </div>
          </div>
        </div>
      </main>

    <footer>
      <p>&copy; Fishing game</p>
    </footer>

    <!-- ADD JAVASCRIPTS BEFORE BODY ENDTAG -->

      crossorigin="anonymous"
    ></script>
