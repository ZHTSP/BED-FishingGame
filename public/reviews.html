            <li class="nav-item">

        </div>

    <main class="py-4">
      <div class="container">
        <div class="row">
          <div class="col-12">
            <h1 class="text-center">Give this game a review!</h1>
          </div>
        </div>
      </div>

      <!-- Review Form -->
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-6">
            <form id="reviewForm" class="card shadow p-3">
              <div class="card-body">
                <h5 class="card-title">Leave a Review</h5>
                <div class="mb-3">
                  <label for="reviewAmount" class="form-label">Rating (1-5)</label>
                  <input type="number" class="form-control" id="reviewAmount" min="1" max="5" required>
                </div>
                <button type="submit" class="btn btn-primary">Submit Review</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Display Reviews -->
      <div class="container mt-5">
        <div class="row">
          <div class="col-12">
            <h2 class="text-center">Reviews</h2>
            <div id="reviewList" class="row text-center my-4"></div>
          </div>
        </div>
      </div>
    </main>

    <footer>
      <p>&copy; Fishing game</p>
    </footer>
